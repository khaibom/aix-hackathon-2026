[project]
name = "mvp-scorer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "google-genai>=1.0",
    "google-generativeai>=0.8.6",
    "httpx>=0.27",
    "pydantic>=2",
    "pytest>=8",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
score = "scorer:main"


